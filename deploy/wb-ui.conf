# Wiren Board UI concept: full v2.208.1 frontend, stock UI remains on port 80.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /mnt/data/wb-ui/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-cache always;
    # Native SVG formulas and device-editor conditions evaluate trusted expressions.
    # MQTT settings can point to an external broker, as in the installed frontend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws: wss: http: https:; img-src 'self' data: blob: http: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Route through stock nginx so its session checks and MQTT ACLs still apply.
    location = /mqtt {
        proxy_pass http://127.0.0.1:80/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location ~ ^/(auth|device|api|ui)/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the original upload and backup CGI endpoints and their auth checks.
    location ^~ /fwupdate/ {
        client_max_body_size 1000M;
        client_body_timeout 1h;
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Generated archives and uploaded assets belong to the existing installation.
    location ~ ^/(uploads|diag)/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Bundled images take priority; retain references to installation-specific files.
    location /images/ {
        try_files $uri @stock_assets;
    }

    location @stock_assets {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
