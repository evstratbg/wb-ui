name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Configure alternative UI
        run: cp .env.concept .env
      - name: Tests
        run: npm test -- --runInBand
      - name: Production build
        run: npm run build
      - name: Validate and package deploy files
        working-directory: .
        run: |
          for script in deploy/*.sh; do sh -n "$script"; done
          sh deploy/package-build.sh "$RUNNER_TEMP/wb-ui-static.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum wb-ui-static.tar.gz > SHA256SUMS
      - name: Upload installable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wb-ui-static
          path: |
            ${{ runner.temp }}/wb-ui-static.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish prebuilt UI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wb-ui-static
          path: ${{ runner.temp }}/wb-ui-release
      - name: Verify release archive
        working-directory: ${{ runner.temp }}/wb-ui-release
        run: sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/wb-ui-release/wb-ui-static.tar.gz" \
            "$RUNNER_TEMP/wb-ui-release/SHA256SUMS" \
            --verify-tag --prerelease --title "wb-ui $RELEASE_TAG" --notes-from-tag
